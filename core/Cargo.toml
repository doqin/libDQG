[package]
name = "libdqg"
version = "0.1.0"
edition = "2024"

[dependencies]
pollster = "0.4.0"
wgpu = "29.0.3"
winit = "0.30.13"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"]}

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }
